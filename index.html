<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bajolahoz - Cupones, Ofertas y Errores de Precio</title>
    <style>
        /* Estilos CSS simplificados para el layout */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #f4f6f9; padding-bottom: 50px; }
        header { background: #2f3542; color: white; text-align: center; padding: 30px 15px; }
        .container { max-width: 600px; margin: 25px auto; padding: 0 15px; }
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .seccion-titulo { font-weight: bold; margin: 20px 0; padding-left: 10px; }
        .card img { max-width: 100%; height: auto; } /* Placeholder for images */
        .coupon-box { background: #f1f2f6; border: 2px dashed #2ed573; padding: 10px; text-align: center; }
        .btn-go { display: block; text-align: center; padding: 10px; text-decoration: none; color: white; background: #2f3542; border-radius: 8px; }
        .comments-section { border-top: 1px solid #ddd; margin-top: 15px; padding-top: 10px; }
    </style>
</head>
<body>
    <header><h1>BAJOLAHOZ</h1></header>
    <div class="container">
        <!-- Contenido estructurado: Errores, Ofertas, Cupones -->
        <div id="errores" class="seccion-titulo">🚨 ERRORES</div>
        <div class="card"><h3>TV 55"</h3><div class="comments-section"><div id="HCB_comment_box_errores">Comentarios Errores</div></div></div>

        <div id="ofertas" class="seccion-titulo">🔥 OFERTAS</div>
        <div class="card"><h3>Zapatillas</h3><div class="comments-section"><div id="HCB_comment_box_ofertas">Comentarios Ofertas</div></div></div>

        <div id="cupones" class="seccion-titulo">✂️ CUPONES</div>
        <div class="card"><h3>Descuento</h3><div class="coupon-box">HOZ10</div><div class="comments-section"><div id="HCB_comment_box_cupones">Comentarios Cupones</div></div></div>
    </div>
    <!-- Script de carga de comentarios separados -->
    <script type="text/javascript">
        function cargarComentarios(id, unique) {
            var s = document.createElement("script");
            s.src = "https://htmlcommentbox.com" + unique + "&opts=16798";
            document.getElementById(id).appendChild(s);
        }
        window.onload = function() {
            cargarComentarios("HCB_comment_box_errores", "seccion_errores");
            cargarComentarios("HCB_comment_box_ofertas", "seccion_ofertas");
            cargarComentarios("HCB_comment_box_cupones", "seccion_cupones");
        };
    </script>
</body>
</html>
